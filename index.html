<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одағайды тап! - Қазақ тілі ойыны</title>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --correct-color: #2ecc71;
            --wrong-color: #e67e22;
            --text-dark: #2c3e50;
            --shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#d4e6f1 10%, transparent 10%);
            background-size: 20px 20px;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Container is wider now to fit both players */
        .container {
            width: 95%;
            max-width: 1200px;
            background: white;
            border-radius: 25px;
            padding: 20px 30px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            color: #8e44ad;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #f39c12;
            letter-spacing: 2px;
        }

        /* Split Screen Layout */
        .split-screen {
            display: flex;
            gap: 20px;
            width: 100%;
            margin-top: 10px;
        }

        .player-panel {
            flex: 1;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
            position: relative;
        }

        .player1-panel {
            background: #ebf5fb;
            border: 4px solid var(--p1-color);
        }

        .player2-panel {
            background: #fdedec;
            border: 4px solid var(--p2-color);
        }

        .player-title {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .p1-title { color: var(--p1-color); text-shadow: 1px 1px #fff; }
        .p2-title { color: var(--p2-color); text-shadow: 1px 1px #fff; }

        .score-display {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: white;
            padding: 10px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Question Box */
        .question-box {
            font-size: 1.8rem;
            margin-bottom: 20px;
            padding: 20px;
            background: #fff9c4;
            border-radius: 15px;
            border: 3px dashed #f1c40f;
            min-height: 120px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        /* Options */
        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
            min-height: 140px;
        }

        .option-btn {
            font-size: 1.4rem;
            padding: 12px 25px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d35400;
            transition: all 0.1s ease;
            flex: 1 1 30%;
            max-width: 45%;
        }

        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #d35400;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #d35400;
        }

        .option-btn.correct {
            background: var(--correct-color) !important;
            box-shadow: 0 5px 0 #27ae60 !important;
        }

        .option-btn.wrong {
            background: var(--wrong-color) !important;
            box-shadow: 0 5px 0 #d35400 !important;
            opacity: 0.7;
        }

        /* Feedback Message */
        .feedback {
            font-size: 2.2rem;
            font-weight: bold;
            min-height: 50px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feedback.show {
            opacity: 1;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Win Screen */
        .win-message {
            font-size: 4rem;
            margin-bottom: 30px;
            color: #f1c40f;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .btn-large {
            font-size: 2rem;
            padding: 20px 50px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 #27ae60;
            transition: transform 0.1s;
            margin-top: 20px;
        }

        .btn-large:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #27ae60;
        }

        /* Responsive - stack on smaller screens */
        @media (max-width: 900px) {
            .split-screen { flex-direction: column; }
            .player-panel { min-height: 450px; }
            h1 { font-size: 2.2rem; }
            .question-box { font-size: 1.5rem; min-height: 90px; }
            .option-btn { font-size: 1.2rem; padding: 10px; max-width: 100%; flex: 1 1 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
        <h1>Одағайды тап!</h1>
        <p style="font-size: 1.5rem; margin-bottom: 30px;">
            Екі ойыншы қатар жарысады! Кім бірінші болып 6 ұпай жинаса, сол жеңімпаз атанады.<br>
            Өз терезеңіздегі сөйлемнің ішінен одағай сөзді тез табыңыз!
        </p>
        <button class="btn-large" onclick="startGame()">Ойынды бастау!</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="split-screen">
            
            <!-- 1-ОЙЫНШЫ ТЕРЕЗЕСІ -->
            <div class="player-panel player1-panel" id="p1-panel">
                <h2 class="player-title p1-title">1-ойыншы</h2>
                <div class="score-display">Ұпай: <span id="p1-score">0</span></div>
                <div class="question-box" id="p1-question">Сұрақ күтілуде...</div>
                <div class="options" id="p1-options">
                    <!-- Options for Player 1 -->
                </div>
                <div class="feedback" id="p1-feedback">Дұрыс!</div>
            </div>

            <!-- 2-ОЙЫНШЫ ТЕРЕЗЕСІ -->
            <div class="player-panel player2-panel" id="p2-panel">
                <h2 class="player-title p2-title">2-ойыншы</h2>
                <div class="score-display">Ұпай: <span id="p2-score">0</span></div>
                <div class="question-box" id="p2-question">Сұрақ күтілуде...</div>
                <div class="options" id="p2-options">
                    <!-- Options for Player 2 -->
                </div>
                <div class="feedback" id="p2-feedback">Дұрыс!</div>
            </div>

        </div>
    </div>

    <!-- WIN SCREEN -->
    <div id="win-screen" class="screen">
        <h1 class="win-message" id="win-text">Жеңімпаз: 1-ойыншы!</h1>
        <button class="btn-large" onclick="startGame()">Қайта жарысу</button>
    </div>
</div>

<script>
    const allQuestions = [
        { text: "Уау, бұл қандай әдемі!", options: ["Уау", "бұл", "әдемі"], answer: "Уау" },
        { text: "Ой, мынау не нәрсе?", options: ["Ой", "мынау", "не"], answer: "Ой" },
        { text: "Апыр-ай, мына баланың бойы ұзын екен!", options: ["Апыр-ай", "мына", "бойы"], answer: "Апыр-ай" },
        { text: "Алақай, біз жеңдік!", options: ["Алақай", "біз", "жеңдік"], answer: "Алақай" },
        { text: "Ура, жазғы демалыс басталды!", options: ["Ура", "жазғы", "демалыс"], answer: "Ура" },
        { text: "Әттеген-ай, кешігіп қалдым.", options: ["Әттеген-ай", "кешігіп", "қалдым"], answer: "Әттеген-ай" },
        { text: "Пах шіркін, қандай дәмді!", options: ["Пах шіркін", "қандай", "дәмді"], answer: "Пах шіркін" },
        { text: "Бәрекелді, жарайсың!", options: ["Бәрекелді", "жарайсың", "сен"], answer: "Бәрекелді" },
        { text: "Қап, кілтімді ұмытып кетіппін.", options: ["Қап", "кілтімді", "ұмытып"], answer: "Қап" },
        { text: "Ойбай, мына ит үлкен екен!", options: ["Ойбай", "мына", "ит"], answer: "Ойбай" },
        { text: "Тәйтті, бұзық болма!", options: ["Тәйтті", "бұзық", "болма"], answer: "Тәйтті" },
        { text: "Мәссаған, мына кітап өте қызық!", options: ["Мәссаған", "мына", "өте"], answer: "Мәссаған" },
        { text: "Тәйт, тыныш отыр!", options: ["Тәйт", "тыныш", "отыр"], answer: "Тәйт" },
        { text: "Ах, таза ауа неткен керемет!", options: ["Ах", "таза", "ауа"], answer: "Ах" },
        { text: "Шіркін-ай, ауылға барсақ қой!", options: ["Шіркін-ай", "ауылға", "барсақ"], answer: "Шіркін-ай" }
    ];

    // Ойыншылардың жеке күйлері
    let p1State = { score: 0, qIndex: 0, questions: [], canClick: false };
    let p2State = { score: 0, qIndex: 0, questions: [], canClick: false };
    
    let gameActive = false;
    const winScore = 6;

    // Дыбыс баптаулары
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, vol=0.1) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = type;
        oscillator.frequency.value = freq;
        gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
    }

    function playSuccessSound() {
        playTone(523.25, 'sine', 0.1); 
        setTimeout(() => playTone(659.25, 'sine', 0.2), 100); 
    }

    function playWrongSound() {
        playTone(300, 'sawtooth', 0.2);
    }

    function playWinSound() {
        let t = 0;
        [523.25, 659.25, 783.99, 1046.50].forEach(freq => {
            setTimeout(() => playTone(freq, 'square', 0.3, 0.1), t);
            t += 150;
        });
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        gameActive = true;
        
        // Ойыншылардың көрсеткіштерін нөлдеу және сұрақтарын жеке араластыру
        p1State = { score: 0, qIndex: 0, questions: shuffleArray(allQuestions), canClick: true };
        p2State = { score: 0, qIndex: 0, questions: shuffleArray(allQuestions), canClick: true };

        document.getElementById('p1-score').innerText = "0";
        document.getElementById('p2-score').innerText = "0";
        
        document.getElementById('p1-feedback').classList.remove('show');
        document.getElementById('p2-feedback').classList.remove('show');

        renderQuestion(1);
        renderQuestion(2);
        
        switchScreen('game-screen');
    }

    function renderQuestion(playerId) {
        if (!gameActive) return;

        let state = playerId === 1 ? p1State : p2State;
        
        // Егер сұрақтар бітіп қалса, қайта араластырамыз
        if (state.qIndex >= state.questions.length) {
            state.questions = shuffleArray(allQuestions);
            state.qIndex = 0;
        }

        const q = state.questions[state.qIndex];
        document.getElementById(`p${playerId}-question`).innerText = q.text;

        const optionsContainer = document.getElementById(`p${playerId}-options`);
        optionsContainer.innerHTML = '';

        const shuffledOptions = shuffleArray(q.options);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = `option-btn p${playerId}-btn`;
            btn.innerText = opt;
            
            // Түсін таңдау (басқан кезде әдемі көрінуі үшін)
            btn.style.backgroundColor = playerId === 1 ? "var(--p1-color)" : "var(--p2-color)";
            btn.style.boxShadow = `0 5px 0 ${playerId === 1 ? "#2980b9" : "#c0392b"}`;
            
            btn.onclick = () => checkAnswer(opt, btn, playerId);
            optionsContainer.appendChild(btn);
        });

        document.getElementById(`p${playerId}-feedback`).classList.remove('show');
        state.canClick = true;
    }

    function checkAnswer(selectedOption, buttonElement, playerId) {
        if (!gameActive) return;

        let state = playerId === 1 ? p1State : p2State;
        
        if (!state.canClick) return;
        state.canClick = false; // Тек осы ойыншының терезесін уақытша бұғаттау

        const q = state.questions[state.qIndex];
        const isCorrect = (selectedOption === q.answer);
        const feedback = document.getElementById(`p${playerId}-feedback`);

        if (isCorrect) {
            buttonElement.classList.add('correct');
            playSuccessSound();
            state.score++;
            document.getElementById(`p${playerId}-score`).innerText = state.score;
            feedback.innerText = "Дұрыс! 🌟";
            feedback.style.color = "var(--correct-color)";
        } else {
            buttonElement.classList.add('wrong');
            playWrongSound();
            feedback.innerText = "Қате! 😔";
            feedback.style.color = "var(--wrong-color)";
            
            // Дұрыс жауапты жасылмен көрсету
            const buttons = document.querySelectorAll(`.p${playerId}-btn`);
            buttons.forEach(btn => {
                if (btn.innerText === q.answer) {
                    btn.classList.add('correct');
                }
            });
        }

        feedback.classList.add('show');

        // Жеңісті тексеру
        if (state.score >= winScore) {
            gameActive = false; // Ойынды тоқтату (екінші ойыншы да баса алмайды)
            p1State.canClick = false;
            p2State.canClick = false;
            
            setTimeout(() => {
                showWinner(playerId);
            }, 1000);
            return;
        }

        // 1.5 секундтан кейін ТЕК ОСЫ ойыншыға келесі сұрақты шығару
        setTimeout(() => {
            if (!gameActive) return;
            state.qIndex++;
            renderQuestion(playerId);
        }, 1500);
    }

    function showWinner(playerNumber) {
        playWinSound();
        const winText = document.getElementById('win-text');
        winText.innerText = `Алақай!\nЖеңімпаз: ${playerNumber}-ойыншы! 🎉`;
        winText.style.color = playerNumber === 1 ? "var(--p1-color)" : "var(--p2-color)";
        switchScreen('win-screen');
    }

</script>
</body>
</html>
